# Generated by scarlet. Builds an image for every commit on main,
# tags it with the commit SHA and pushes it to GHCR. Deploys are done
# with the `scarlet` CLI, which points staging/production at a SHA.
name: scarlet
run-name: ${{ inputs.sha && format('scarlet build {0}', inputs.sha) || github.event.head_commit.message }}

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA to (re)build
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: scarlet-${{ inputs.sha || github.sha }}

env:
  IMAGE: ghcr.io/joshualarido/relay

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}

      - id: rev
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ steps.rev.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.rev.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Keep only the newest 20 images in GHCR. Servers keep their
  # running images locally, so deployed versions stay available.
  cleanup:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          package-name: relay
          package-type: container
          min-versions-to-keep: 20
